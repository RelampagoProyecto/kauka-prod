    <style>
      :root {

      }
      .catalogo-redirect-rombo {
        width: 88px;
        height: 120px;
        margin: 0 auto 24px;
        background-color: rgb(230, 165, 65);
        -webkit-mask-image: var(--rombo);
        mask-image: var(--rombo);
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

      .catalogo-redirect-title {

      .catalogo-redirect-note {

        text-underline-offset: 0.2em;
      }
